# Research helper (only on the "research" branch): downloads OpenStreetMap land use,
# buildings and place areas around a few towns, to check how city shapes are built.
name: Overpass samples

on:
  workflow_dispatch:
  push:
    branches: [research]
    paths:
      - 'research/overpass/towns.txt'
      - '.github/workflows/overpass-sample.yml'

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Download
        run: |
          get() {  # get <query> <file>: retries on busy servers, alternating servers
            for i in 1 2 3 4 5 6; do
              for server in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://overpass.kumi.systems/api/interpreter; do
                if curl -sS --max-time 180 -A "RibolovMK research" --data-urlencode "data=$1" "$server" -o "$2.tmp" \
                   && python3 -c "import json,sys; json.load(open(sys.argv[1]))['elements']" "$2.tmp" 2>/dev/null; then
                  mv "$2.tmp" "$2"; return 0
                fi
                sleep $((i * 10))
              done
            done
            echo "::warning::failed $2"; rm -f "$2.tmp"
          }
          grep -v '^\s*\(#\|$\)' research/overpass/towns.txt | while read -r name lat lon r; do
            box=$(python3 -c "import math;la,lo,r=$lat,$lon,$r;d=r/110540;e=r/(111320*math.cos(math.radians(la)));print(f'{la-d:.5f},{lo-e:.5f},{la+d:.5f},{lo+e:.5f}')")
            [ -s "research/overpass/$name-landuse.json" ] && grep -q '"elements"' "research/overpass/$name-landuse.json" || \
              get "[out:json][timeout:120];(way[\"landuse\"]($box);relation[\"landuse\"]($box);way[\"place\"]($box);relation[\"place\"]($box););out geom qt;" "research/overpass/$name-landuse.json"
            [ -s "research/overpass/$name-buildings.json" ] && grep -q '"elements"' "research/overpass/$name-buildings.json" || \
              get "[out:json][timeout:120];way[\"building\"]($box);out geom qt;" "research/overpass/$name-buildings.json"
            get "[out:json][timeout:120];way[\"highway\"~\"^(residential|living_street|pedestrian|tertiary|unclassified|service)$\"]($box);out geom qt;" "research/overpass/$name-streets.json"
            echo "::notice::$name done"
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/overpass
          git diff --staged --quiet && exit 0
          git commit -q -m "Research: Overpass samples around towns"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 10; done
