# Research helper (only on the "research" branch): OCR of large scanned PDFs, split into
# parallel jobs so each job stays well under the time limit. Each job reads every 4th
# scanned page and commits research/text/<name>.ocr.part<N>.txt.
name: OCR large scans

on:
  workflow_dispatch:
  push:
    branches: [research]
    paths:
      - 'research/ocr-urls.txt'
      - '.github/workflows/ocr-split.yml'

permissions:
  contents: write

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v6

      - name: Install tools
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils tesseract-ocr tesseract-ocr-mkd

      - name: OCR
        run: |
          mkdir -p pdf research/text
          grep -v '^\s*\(#\|$\)' research/ocr-urls.txt | while read -r url; do
            wget -q -nd -nc --timeout=120 -P pdf "$url" || echo "::warning::failed: $url"
          done
          for f in pdf/*.pdf; do
            base=$(basename "$f" .pdf)
            pages=$(pdfinfo "$f" | awk '/^Pages:/ {print $2}')
            out="research/text/$base.ocr.part${{ matrix.part }}.txt"; : > "$out"
            n=0
            for p in $(seq 1 "$pages"); do
              [ $((p % 4)) -eq ${{ matrix.part }} ] || continue
              chars=$(pdftotext -f "$p" -l "$p" "$f" - 2>/dev/null | tr -d '[:space:]' | wc -c)
              [ "$chars" -lt 400 ] || continue
              pdftoppm -f "$p" -l "$p" -r 250 -gray -png -singlefile "$f" page
              tesseract page.png page -l mkd+eng --psm 4 >/dev/null 2>&1
              { echo "===== PAGE $p ====="; cat page.txt; } >> "$out"
              n=$((n+1))
            done
            echo "::notice::$base part ${{ matrix.part }}: $n pages"
          done

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/text
          git diff --staged --quiet && exit 0
          git commit -q -m "Research: OCR part ${{ matrix.part }}"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep $((RANDOM % 20 + 5)); done
