# Research helper (only on the "research" branch, not part of the website):
# downloads the documents listed in research/urls.txt, converts PDFs to text and
# commits the text to research/text/, so the sources can be read and checked.
name: Fetch research sources

on:
  workflow_dispatch:
  push:
    branches: [research]
    paths:
      - 'research/urls.txt'
      - '.github/workflows/fetch-research.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Install pdftotext
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils tesseract-ocr tesseract-ocr-mkd

      - name: Download and convert
        run: |
          mkdir -p pdf research/text research/listings
          ok=0; failed=0
          while read -r url; do
            case "$url" in ''|\#*) continue;; esac
            if [[ "$url" == links:* ]]; then
              # "links:" = download every PDF that this page links to
              page="${url#links:}"
              name=$(echo "$page" | md5sum | cut -c1-8)
              final=$(curl -sSL --max-time 90 -w '%{url_effective}' "$page" -o "research/listings/$name.html") || { echo "::warning::page failed: $page"; continue; }
              echo "$page -> $final" >> research/listings/redirects.txt
              [ "$final" != "$page" ] && echo "::notice::$page -> $final"
              sed 's#\\/#/#g' "research/listings/$name.html" \
                | grep -oiE 'https?://[^"'"'"' <>]+\.pdf' | sort -u > "research/listings/$name.pdf-links.txt" || true
              echo "::notice::$(wc -l < "research/listings/$name.pdf-links.txt") PDF links on $page"
              while read -r pdfurl; do
                wget -q -nd -nc --restrict-file-names=nocontrol --timeout=120 -P pdf "$pdfurl" || echo "failed $pdfurl"
              done < "research/listings/$name.pdf-links.txt"
            else
              if wget -q -nd -nc --content-disposition -U "Mozilla/5.0 (X11; Linux x86_64)" --restrict-file-names=nocontrol --timeout=120 -P pdf "$url"; then ok=$((ok+1)); else failed=$((failed+1)); echo "::warning::failed: $url"; fi
            fi
          done < research/urls.txt
          for f in pdf/*; do
            base=$(basename "$f"); base="${base%.*}"
            pdftotext -layout "$f" "research/text/$base.txt" 2>/dev/null || { echo "::warning::not a readable PDF: $f"; continue; }
            # Scanned pages (almost no text) are read with OCR (Macedonian + English)
            pages=$(pdfinfo "$f" | awk '/^Pages:/ {print $2}')
            scanned=""
            for p in $(seq 1 "$pages"); do
              n=$(pdftotext -f "$p" -l "$p" "$f" - 2>/dev/null | tr -d '[:space:]' | wc -c)
              [ "$n" -lt 400 ] && scanned="$scanned $p"
            done
            if [ -n "$scanned" ]; then
              echo "::notice::$base: OCR on $(echo $scanned | wc -w) scanned pages"
              mkdir -p "ocr/$base"
              echo $scanned | tr ' ' '\n' | xargs -P 4 -I{} sh -c \
                'pdftoppm -f {} -l {} -r 300 -gray -png -singlefile "$0" "ocr/$1/p{}" && tesseract "ocr/$1/p{}.png" "ocr/$1/page-$(printf %04d {})" -l mkd+eng --psm 4 >/dev/null 2>&1' "$f" "$base"
              for t in $(ls ocr/"$base"/page-*.txt | sort); do
                echo "===== PAGE $(basename "$t" .txt | sed 's/page-0*//') ====="; cat "$t"
              done > "research/text/$base.ocr.txt"
              # Small documents: keep the page images too, so tables can be checked by eye
              if [ "$(echo $scanned | wc -w)" -le 12 ]; then
                mkdir -p "research/pages/$base"
                for p in $scanned; do
                  pdftoppm -f "$p" -l "$p" -r 150 -png -singlefile "$f" "research/pages/$base/page-$p"
                done
              fi
            fi
          done
          echo "::notice::single files ok=$ok failed=$failed; PDFs downloaded: $(ls pdf | wc -l); text files: $(ls research/text | wc -l)"

      - name: Commit the text (not the PDFs)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/text research/listings research/pages 2>/dev/null || git add research/text research/listings
          if git diff --staged --quiet; then echo "Nothing new."; else
            git commit -q -m "Research sources: extracted text"
            git pull -q --rebase && git push -q
          fi
