<!doctype html>
<html lang="mk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>РиболовМК – мапа за риболов во Македонија</title>
  <meta name="description" content="Мапа за риболов во Македонија: реки, езера и акумулации, со информации за риби и дозволи.">
  <meta name="theme-color" content="#000000">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">

  <!-- Leaflet 1.9.4 (map library), pinned version -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <h1 id="site-title">РиболовМК</h1>
      <p id="site-subtitle">Мапа за риболов во Македонија</p>
    </div>
    <button id="lang-switch" class="lang-switch" type="button" aria-label="Switch to English">EN</button>
  </header>

  <main class="map-area">
    <div id="map" role="region" aria-label="Мапа на реките и езерата во Македонија"></div>

    <div class="filter">
      <button id="filter-toggle" class="filter-toggle" type="button" aria-expanded="false" aria-controls="filter-list">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M4 5h16l-6 7.5V19l-4-2v-4.5L4 5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        </svg>
        <span id="filter-label">Филтер</span>
      </button>
      <div id="filter-list" class="filter-list" role="group" aria-label="Прикажи на мапата" hidden></div>
    </div>
    <p id="hint" class="hint">Изберете река или езеро</p>
    <p id="message" class="message" role="alert" hidden></p>

    <aside id="panel" class="panel" hidden aria-labelledby="panel-title">
      <button id="panel-close" class="panel-close" type="button" aria-label="Затвори">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <div id="panel-content"></div>
    </aside>
  </main>

  <noscript>
    <p class="message">Оваа мапа бара JavaScript. / This map needs JavaScript.</p>
  </noscript>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- topojson-client 3.1.0 (reads the municipality areas), pinned version -->
  <script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js"
          integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin=""></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
